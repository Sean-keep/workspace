<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="个人工作台">
  <!--
    maskable：底色铺满整张画布，图形压到中心。安全区是圆心在 (256,256)、半径 205
    （画布的 40%）的圆，四角会被启动器裁成圆/方 —— 图形距圆心最远 156，留得住。
    构图与 scripts/gen_icons.py 一致，改一边记得改另一边。
  -->
  <rect width="512" height="512" fill="#409eff"/>
  <rect x="146" y="146" width="96" height="96" rx="20" fill="#ffffff"/>
  <rect x="270" y="146" width="96" height="96" rx="20" fill="#ffffff" opacity="0.82"/>
  <rect x="146" y="270" width="96" height="96" rx="20" fill="#ffffff" opacity="0.82"/>
  <rect x="270" y="270" width="96" height="96" rx="20" fill="#ffffff"/>
</svg>
