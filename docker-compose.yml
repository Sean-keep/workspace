# Secrets come from .env (copy .env.example → .env). Compose refuses to start
# if MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD / SECRET_KEY / REDIS_PASSWORD are missing.
# Image prefixes are the Huawei Cloud SWR mirrors used on this network.

services:
  workspace-mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.0
    container_name: workspace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-personal_workspace}
      MYSQL_USER: ${DB_USER:-workspace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    # Uncomment to debug MySQL from the host:
    # ports:
    #   - "3308:3306"
    volumes:
      - workspace-mysql-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - workspace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  workspace-redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:7-alpine
    container_name: workspace-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    # Uncomment to debug Redis from the host:
    # ports:
    #   - "6380:6379"
    volumes:
      - workspace-redis-data:/data
    networks:
      - workspace-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  workspace-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workspace-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: workspace-mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-workspace}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_NAME: ${DB_NAME:-personal_workspace}
      REDIS_HOST: workspace-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-300}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      DEBUG: ${DEBUG:-false}
    depends_on:
      workspace-mysql:
        condition: service_healthy
      workspace-redis:
        condition: service_healthy
    networks:
      - workspace-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  workspace-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workspace-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      workspace-backend:
        condition: service_healthy
    networks:
      - workspace-network

volumes:
  # Pin the on-disk names so compose reuses the volumes created by earlier
  # `docker run` setups instead of allocating project-prefixed empties.
  workspace-mysql-data:
    name: workspace-mysql-data
  workspace-redis-data:
    name: workspace-redis-data

networks:
  workspace-network:
    name: workspace-network
    driver: bridge
